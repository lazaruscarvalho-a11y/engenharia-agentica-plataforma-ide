name: Verificacoes exploratorias da fundacao
on:
  push:
    branches: ['proposta/fundacao-integral-pm-fund-001-003']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B harness/executar_verificacoes.py --saida resultados-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-exploratorias
          path: resultados-ci
